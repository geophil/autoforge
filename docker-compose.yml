version: "3.8"

services:
  nats:
    image: nats:latest
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  autoforge:
    image: oven/bun:latest
    working_dir: /app
    command: ["bun", "run", "src/index.ts"]
    depends_on:
      - nats
    ports:
      - "3000:3000"
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_PATH=/app/data/autoforge.sqlite
      - HOST=0.0.0.0
      - PORT=3000
      - EXECUTOR_DEFAULT=claude-code
    volumes:
      - ./:/app

volumes:
  nats-data:
